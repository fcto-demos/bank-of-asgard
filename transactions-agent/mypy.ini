[mypy]
# Package roots mirror the runtime layout: uvicorn is started with
# PYTHONPATH=$(pwd) (this directory) and --app-dir <agent-folder> (see CLAUDE.md), so
# "app.*"/"auth.*" resolve from this directory while each service.py is a top-level
# module inside its own agent folder, not "<agent-folder>.service". Each agent folder
# has a stray __init__.py (kept only to avoid namespace collisions with the
# same-named PyPI packages, per CLAUDE.md) which otherwise makes mypy treat the
# hyphenated folder name itself as an (invalid) package identifier.
#
# Only "." (this directory, for app.*/auth.*) goes here. Each agent folder is
# deliberately NOT listed — the three agents each ship their own tool.py/service.py,
# and having all three on the path at once makes mypy resolve "import tool" to
# whichever agent folder happens to be listed first, bleeding one agent's types into
# another's check. Add the one agent folder actually being checked via MYPYPATH at
# invocation time instead, e.g.:
#   MYPYPATH=langchain-agent langchain-agent/venv/bin/python3 -m mypy langchain-agent/service.py
mypy_path = .
explicit_package_bases = True
namespace_packages = True
plugins = pydantic.mypy

# Third-party/internal packages with no type stubs or py.typed marker available.
[mypy-asgardeo.*]
ignore_missing_imports = True

[mypy-asgardeo_ai.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True
