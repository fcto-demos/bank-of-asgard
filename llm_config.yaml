# LLM provider configuration for Bank of Asgard AI agents.
#
# provider: openai | gemini | anthropic | bedrock | mistral
# model:    override the default model for the chosen provider
#           (comment out to use the built-in default)
#
# Defaults per provider:
#   openai:    gpt-4o-mini
#   gemini:    gemini-2.5-flash-lite
#   anthropic: claude-haiku-4-5
#   bedrock:   eu.anthropic.claude-sonnet-4-6-20250514-v1:0
#   mistral:   mistral-small-latest
#              (uses AWS_DEFAULT_REGION env var, defaults to eu-north-1)
#              With gateway enabled: routed via WSO2 gateway (Anthropic-compatible API).
#              Without gateway: calls Bedrock Converse API directly via boto3.
#              Only supported by the strands agent implementation.

provider: anthropic
# For Anthropic direct
model: claude-haiku-4-5
# Via Bedrock
# model: eu.anthropic.claude-haiku-4-5-20251001-v1:0

# WSO2 API Gateway — optional (enabled: false bypasses it).
# When enabled, LLM calls are routed via the gateway instead of a direct provider API key,
# authenticated with OAuth2 client credentials or a gateway API key (GATEWAY_AUTH_MODE).
# Set GATEWAY_BASE_URL (and the credentials) in each service's .env —
# gateway-setup/provision.py --write-env does it for a WSO2 AI Gateway.
# The provider above still determines the default model name.
#
gateway:
  enabled: true
